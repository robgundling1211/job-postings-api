[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "veritahire"
version = "0.3.2"
description = "Job postings API client: live US jobs verified on employers' own career sites, still-open checks, full feed, and a competitive hiring report for one healthcare, finance, IT, engineering, science, HR, legal or marketing role."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = ["requests>=2.20"]
keywords = ["jobs api", "job postings api", "job search api", "indeed api", "linkedin jobs api", "job data", "talent intelligence", "salary benchmarking", "time to hire"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Topic :: Internet :: WWW/HTTP"]

[project.urls]
Homepage = "https://veritahire.com/developers/"
Source = "https://github.com/robgundling1211/job-postings-api"
Documentation = "https://veritahire.com/openapi.json"
