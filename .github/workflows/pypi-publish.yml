# Publish the Python client to PyPI when a GitHub release is published - PyPI "trusted publishing" (OIDC): no API token
# exists anywhere. PyPI trusts this exact repo + workflow + environment, configured on pypi.org by the account owner.
name: Publish Python client to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # the OIDC token PyPI verifies - the only credential, minted per run
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        working-directory: clients/python
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: clients/python/dist
